<div class="hidden fixed inset-0 z-50 bg-black/92 backdrop-blur-md flex items-center justify-center p-4" id="video-modal" onclick="if(event.target===this) closeVideoModal()">
<button aria-label="Закрыть видео" class="absolute top-4 right-4 z-30 w-11 h-11 rounded-full bg-emerald-deep/90 border border-gold/50 text-gold hover:bg-gold hover:text-emerald-deep flex items-center justify-center transition-all" onclick="closeVideoModal()" type="button">
<svg aria-hidden="true" class="material-symbols-outlined" fill="currentColor" viewbox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
</button>
<button aria-label="Предыдущее видео" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-emerald-deep/90 border-2 border-gold/70 text-gold hover:bg-gold hover:text-emerald-deep flex items-center justify-center transition-all shadow-2xl" onclick="navigateVideoModal(-1)" type="button">
<svg aria-hidden="true" class="material-symbols-outlined text-2xl" fill="currentColor" viewbox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg>
</button>
<div class="w-full max-w-2xl flex flex-col items-center">
<video class="w-full max-h-[80vh] rounded-2xl border border-gold/40 bg-black shadow-2xl object-contain" controls="" id="modal-video-player" playsinline=""></video>
<div class="mt-3 flex items-center gap-3">
<p class="font-headline text-lg text-gold-light text-center" id="modal-video-title"></p>
<span class="px-2.5 py-0.5 rounded-full bg-emerald-deep/90 border border-gold/40 font-label text-xs text-gold" id="modal-video-counter"></span>
</div>
</div>
<button aria-label="Следующее видео" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-emerald-deep/90 border-2 border-gold/70 text-gold hover:bg-gold hover:text-emerald-deep flex items-center justify-center transition-all shadow-2xl" onclick="navigateVideoModal(1)" type="button">
<svg aria-hidden="true" class="material-symbols-outlined text-2xl" fill="currentColor" viewbox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path></svg>
</button>
</div>
